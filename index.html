const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function openS(c,s,d,g){const sess=S.sess[sk(c,s,d)]||(S.sess[sk(c,s,d)]={a:{},g:{}});const tp=s=='TP CAO',list=ST[c].map((x,i)=>({x,i})).filter(o=>!g||grp(o.i)==g);const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="row"><button onclick="this.closest('.ov').remove();save();render()">← Retour</button><b>${c=='1'?'1ère':'2ème'} année · ${s}</b></div><p class="m">${fd(d)}${g?' · Groupe '+g:''}${hol(d)?' · ⚠ '+esc(hol(d)):''}</p>`+list.map(({x,i})=>`<div class="card row"><div style="flex:1"><span class="m">${i+1}</span> <b dir="auto">${esc(x[1]+' '+x[2])}</b>${tp?`<div class="m">Moy. TP : <b id="m${x[0]}">${tpAvg(x[0])}</b>/20</div>`:''}</div>${tp?`<input class="n" type="number" min="0" max="20" step="0.25" placeholder="/20" value="${sess.g[x[0]]??''}" oninput="setG('${c}','${s}','${d}','${x[0]}',this.value)">`:''}<button id="b${x[0]}" class="${sess.a[x[0]]?'A':'P'}" onclick="tg('${c}','${s}','${d}','${x[0]}',this)">${sess.a[x[0]]?'Absent':'Présent'}</button></div>`).join('');document.body.appendChild(o)}
function tg(c,s,d,id,b){const r=S.sess[sk(c,s,d)];if(r.a[id]){delete r.a[id];b.className='P';b.textContent='Présent'}else{r.a[id]=1;b.className='A';b.textContent='Absent'}save()}
function setG(c,s,d,id,v){const r=S.sess[sk(c,s,d)];if(v==='')delete r.g[id];else r.g[id]=Math.max(0,Math.min(20,+v));save();const el=document.getElementById('m'+id);if(el)el.textContent=tpAvg(id)}
function vEV(){const L=S.evals.filter(e=>e.cls==cls);return `<div class="card"><div class="row"><select onchange="cls=this.value;render()"><option value="1" ${cls=='1'?'selected':''}>1ère année</option><option value="2" ${cls=='2'?'selected':''}>2ème année</option></select><button class="p" onclick="newEv()">+ Nouvelle évaluation</button></div></div>`+(L.length?L.map(e=>{const v=Object.values(e.g);return `<div class="card row" onclick="openE('${e.id}')"><div><b>${esc(e.title)}</b><div class="m">${e.type}${e.sem?' · S'+e.sem:''} · ${e.subj} · ${fd(e.date)}</div></div><div class="m">moy. ${avg(v)}<br>${v.length}/${ST[e.cls].length}</div></div>`}).join(''):'<p class="m">Aucune évaluation. Créez un DS ou un examen.</p>')}
function newEv(){const o=document.createElement('div');o.className='ov';const ex=cls=='1'?['Examen de passage']:['Examen national'];o.innerHTML=`<div class="card"><b>Nouvelle évaluation (${cls=='1'?'1ère':'2ème'} année)</b><p><select id="et">${['Devoir surveillé',...ex].map(t=>`<option>${t}</option>`).join('')}</select> <select id="es">${subs(cls).map(s=>`<option>${s}</option>`).join('')}</select></p><p><select id="esm"><option value="1">Semestre 1</option><option value="2">Semestre 2</option></select> <select id="en"><option value="1">DS 1</option><option value="2">DS 2</option></select></p><p><input id="ett" placeholder="Titre (facultatif)"></p><p><input type="date" id="ed" value="${today}"></p><div class="row"><button onclick="this.closest('.ov').remove()">Annuler</button><button class="p" onclick="addEv()">Créer</button></div></div>`;document.body.appendChild(o)}
function addEv(){const ty=$('#et').value,sj=$('#es').value,sem=+$('#esm').value,n=+$('#en').value,isDS=ty=='Devoir surveillé';if(isDS&&S.evals.some(x=>x.cls==cls&&x.subj==sj&&x.type==ty&&x.sem==sem&&x.n==n)){alert('Ce DS existe déjà');return}const e={id:'e'+Date.now(),cls,type:ty,subj:sj,sem:isDS?sem:0,n:isDS?n:0,title:$('#ett').value||(isDS?`DS${n} – ${sj} – S${sem}`:ty),date:$('#ed').value,g:{}};S.evals.push(e);save();document.querySelector('.ov').remove();render();openE(e.id)}
function openE(id){const e=S.evals.find(x=>x.id==id),o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="row"><button onclick="this.closest('.ov').remove();save();render()">← Retour</button><button onclick="delEv('${id}')">🗑</button></div><p><b>${esc(e.title)}</b><br><span class="m">${e.type} · ${e.subj} · ${fd(e.date)}</span></p>`+ST[e.cls].map((x,i)=>`<div class="card row"><div style="flex:1"><span class="m">${i+1}</span> <b dir="auto">${esc(x[1]+' '+x[2])}</b></div><input class="n" type="number" min="0" max="20" step="0.25" placeholder="/20" value="${e.g[x[0]]??''}" oninput="setE('${id}','${x[0]}',this.value)"></div>`).join('');document.body.appendChild(o)}
function setE(id,s,v){const e=S.evals.find(x=>x.id==id);if(v==='')delete e.g[s];else e.g[s]=Math.max(0,Math.min(20,+v));save()}
function delEv(id){if(confirm('Supprimer cette évaluation ?')){S.evals=S.evals.filter(x=>x.id!=id);save();document.querySelector('.ov').remove();render()}}
function stats(c){return ST[c].map(([id,n,p],i)=>{const ab=s=>Object.entries(S.sess).filter(([k,r])=>k.startsWith(c+'|'+s+'|')&&r.a[id]).length;const ev=(t,s)=>S.evals.filter(e=>e.cls==c&&(t?e.type==t:e.type!='Devoir surveillé')&&(!s||e.subj==s)&&e.g[id]!=null).map(e=>e.g[id]);const tpg=Object.entries(S.sess).filter(([k,r])=>k.startsWith(c+'|TP CAO|')&&r.g[id]!=null).map(([k,r])=>r.g[id]);return{i:i+1,n:n+' '+p,aE:ab('ECSM'),aT:ab('TP CAO'),tp:avg(tpg),dE:avg(ev('Devoir surveillé','ECSM')),dT:avg(ev('Devoir surveillé','TP CAO')),ex:avg(ev(null))}})}
function vBI(){const H=['N°','Étudiant','Abs ECSM','Abs TP','Moy TP séances','DS ECSM','DS TP','Examen'];return `<div class="card"><select onchange="cls=this.value;render()"><option value="1" ${cls=='1'?'selected':''}>1ère année</option><option value="2" ${cls=='2'?'selected':''}>2ème année</option></select> <button onclick="csv()">Exporter CSV</button></div><div class="card sc"><table><tr>${H.slice(0,1).concat(H.slice(1)).map(h=>`<th>${h}</th>`).join('')}</tr>${stats(cls).map(s=>`<tr><td>${s.i}</td><td dir="auto" style="text-align:start">${esc(s.n)}</td><td>${s.aE}</td><td>${s.aT}</td><td>${s.tp}</td><td>${s.dE}</td><td>${s.dT}</td><td>${s.ex}</td></tr>`).join('')}</table></div><textarea id="out" hidden></textarea>`}

function stats(c){return ST[c].map(([id,n,p],i)=>{const ab=s=>Object.entries(S.sess).filter(([k,r])=>k.startsWith(c+'|'+s+'|')&&r.a[id]).length;const ds=(s,sem,k)=>{const e=S.evals.find(e=>e.cls==c&&e.subj==s&&e.type=='Devoir surveillé'&&e.sem==sem&&e.n==k);return e&&e.g[id]!=null?e.g[id]:null};const m=a=>{a=a.filter(x=>x!=null);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null};const f=x=>x==null?'–':x.toFixed(2);const tpg=Object.entries(S.sess).filter(([k,r])=>k.startsWith(c+'|TP CAO|')&&r.g[id]!=null).map(([k,r])=>r.g[id]);const ex=S.evals.filter(e=>e.cls==c&&e.type!='Devoir surveillé'&&e.g[id]!=null).map(e=>e.g[id]);const d=[ds('ECSM',1,1),ds('ECSM',1,2),ds('ECSM',2,1),ds('ECSM',2,2)];return{i:i+1,n:n+' '+p,aE:ab('ECSM'),aT:ab('TP CAO'),nt:tpg.length,tp:f(m(tpg)),d:d.map(f),s1:f(m(d.slice(0,2))),s2:f(m(d.slice(2))),ex:f(m(ex))}})}
function vBI(){const one=cls=='1',H=['N°','Étudiant','Abs ECSM',...(one?['Abs TP','Séances TP','Moy. TP /20']:[]),'DS1 S1','DS2 S1','Moy S1','DS1 S2','DS2 S2','Moy S2',one?'Ex. passage':'Ex. national'];const R=stats(cls).map(s=>[s.i,s.n,s.aE,...(one?[s.aT,s.nt,s.tp]:[]),s.d[0],s.d[1],s.s1,s.d[2],s.d[3],s.s2,s.ex]);window._R=[H,...R];return `<div class="card"><div class="row"><select onchange="cls=this.value;render()"><option value="1" ${one?'selected':''}>1ère année</option><option value="2" ${one?'':'selected'}>2ème année</option></select><button class="p" onclick="csv()">Exporter CSV</button></div></div><div class="card sc"><table><tr>${H.map(h=>`<th>${h}</th>`).join('')}</tr>${R.map(r=>`<tr>${r.map((v,j)=>`<td ${j==1?'dir="auto" style="text-align:start"':''}>${esc(v)}</td>`).join('')}</tr>`).join('')}</table></div><textarea id="out" hidden></textarea>`}
function csv(){const t=window._R.map(r=>r.join(';')).join('\n');const o=$('#out');o.hidden=false;o.value=t;o.select();try{navigator.clipboard.writeText(t)}catch(e){}}

let fdb=null,fauth=null,user=null,unsub=null,pt=null,syncState='off';
function setSync(t){syncState=t;const m={off:'☁ non connecté',ok:'✓ Enregistré dans le cloud',wait:'☁ synchronisation…',err:'☁ erreur de synchro'};document.querySelectorAll('.syncs').forEach(e=>e.textContent=m[t])}
function initSync(){if(typeof firebase==='undefined'){setSync('off');return}
try{firebase.initializeApp(FC);fauth=firebase.auth();fdb=firebase.firestore();fdb.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){setSync('err');return}
fauth.onAuthStateChanged(u=>{user=u;if(unsub){unsub();unsub=null}
if(u){listen()}else{setSync('off');if(tab=='rg')render();if(!localStorage.getItem('btsNoSync'))loginUI()}})}
const ref=()=>fdb.collection('users').doc(user.uid).collection('data').doc('state');
function applyR(rs){S=rs;if(S.stud){ST[1]=S.stud[1];ST[2]=S.stud[2]}ensure();try{localStorage.setItem('bts',JSON.stringify(S))}catch(e){}render()}
function listen(){setSync('wait');let first=true;unsub=ref().onSnapshot(snap=>{
if(!snap.exists){pushNow();return}
const rs=JSON.parse(snap.data().json);
if(first){first=false;const has=Object.keys(S.sess).length||S.evals.length;
if((rs.ts||0)>(S.ts||0)){if(has&&!S.ts&&!confirm('Les données du serveur vont remplacer celles de cet appareil. Continuer ?')){pushNow();return}applyR(rs)}
else if((S.ts||0)>(rs.ts||0)){pushNow()}}
else if((rs.ts||0)>(S.ts||0)&&!document.querySelector('.ov')){applyR(rs)}
if(syncState!='err')setSync(snap.metadata.hasPendingWrites?'wait':'ok');if(tab=='rg')render()},()=>setSync('err'))}
function pushSync(){if(!user||!fdb)return;clearTimeout(pt);setSync('wait');pt=setTimeout(pushNow,700)}
function pushNow(){if(!user||!fdb)return;S.ts=S.ts||Date.now();ref().set({json:JSON.stringify(S),ts:S.ts}).then(()=>setSync('ok')).catch(()=>setSync('err'))}

const o=document.createElement('div');o.className='ov';o.id='lg';o.innerHTML='<div class="card"><b>☁ Connexion pour synchroniser</b><p class="m">Utilisez le même e-mail et le même mot de passe sur le téléphone et sur le PC.</p><p><input id="le" type="email" placeholder="E-mail" style="width:100%"></p><p><input id="lp" type="password" placeholder="Mot de passe" style="width:100%"></p><p id="lm" class="m" style="color:var(--ko)"></p><div class="row"><button onclick="localStorage.setItem(\'btsNoSync\',1);this.closest(\'.ov\').remove()">Continuer sans synchro</button><button class="p" onclick="doLogin()">Se connecter</button></div></div>';document.body.appendChild(o)}

fauth.signInWithEmailAndPassword(e,pw).then(()=>{localStorage.removeItem('btsNoSync');document.getElementById('lg').remove()}).catch(er=>{document.getElementById('lm').textContent=/invalid|wrong|user-not/.test(er.code)?'E-mail ou mot de passe incorrect.':'Erreur : '+er.code})}

let sc='1';
function studCard(){const L=ST[sc];return '<div class="card"><b>👥 Étudiants</b><div class="row" style="margin:8px 0"><select onchange="sc=this.value;render()"><option value="1" '+(sc=='1'?'selected':'')+'>1ère année ('+ST[1].length+')</option><option value="2" '+(sc=='2'?'selected':'')+'>2ème année ('+ST[2].length+')</option></select></div>'+L.map((x,i)=>'<div class="row" style="margin-top:4px"><span class="m">'+(i+1)+' · '+esc(x[1]+' '+x[2])+' · '+esc(x[0])+'</span><button onclick="delSt('+i+')">✕</button></div>').join('')+'<div style="margin-top:8px"><input id="sm" placeholder="Code Massar"> <input id="sn" placeholder="Nom"> <input id="sp" placeholder="Prénom"> <button class="p" onclick="addSt()">Ajouter</button></div><details style="margin-top:10px"><summary><b>📋 Remplacer toute la liste</b></summary><p class="m">Une ligne par étudiant : CODE;NOM;PRÉNOM, dans l\'ordre de la liste officielle. Les étudiants gardent leurs absences et notes grâce au code Massar.</p><textarea id="sl"></textarea><div class="row"><button onclick="fillSt()">Afficher la liste actuelle</button><button class="p" onclick="replSt()">Remplacer la liste</button></div></details></div>'}
function saveSt(){S.stud={1:ST[1],2:ST[2]};save();render()}
function addSt(){const m=document.getElementById('sm').value.trim(),n=document.getElementById('sn').value.trim(),p=document.getElementById('sp').value.trim();if(!m||!n){alert('Code Massar et nom obligatoires');return}if(ST[1].concat(ST[2]).some(x=>x[0]==m)){alert('Ce code existe déjà');return}if(sc=='1'&&ST[1].length>=30){alert('Maximum 30 étudiants en 1ère année (3 groupes de 10)');return}ST[sc]=ST[sc].concat([[m,n,p]]);saveSt()}
function delSt(i){const x=ST[sc][i];if(!confirm('Supprimer '+x[1]+' '+x[2]+' ?\nSes absences et notes restent enregistrées mais ne s\'afficheront plus. En 1ère année, les groupes de TP sont recalculés selon l\'ordre de la liste.'))return;ST[sc]=ST[sc].filter((_,j)=>j!=i);saveSt()}
function fillSt(){document.getElementById('sl').value=ST[sc].map(x=>x.join(';')).join('\n')}
function replSt(){const L=document.getElementById('sl').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>l.split(/[;\t]/).map(x=>x.trim()));if(!L.length||L.some(x=>x.length<2||!x[0]||!x[1])){alert('Chaque ligne doit contenir : CODE;NOM;PRÉNOM');return}const codes=L.map(x=>x[0]);if(new Set(codes).size<codes.length){alert('Un code Massar apparaît deux fois');return}const other=ST[sc=='1'?2:1].map(x=>x[0]);if(codes.some(c=>other.includes(c))){alert('Un de ces codes existe déjà dans l\'autre classe');return}if(sc=='1'&&L.length>30){alert('Maximum 30 étudiants en 1ère année');return}const old=ST[sc].map(x=>x[0]);const out=old.filter(c=>!codes.includes(c)).length,add=codes.filter(c=>!old.includes(c)).length;if(!confirm('Remplacer la liste ?\n'+add+' ajouté(s), '+out+' retiré(s).'))return;ST[sc]=L.map(x=>[x[0],x[1],x[2]||'']);saveSt()}

function seg(){return '<div class="row" style="justify-content:flex-end;margin-bottom:8px"><span style="display:inline-flex;background:var(--b);border-radius:12px;padding:3px">'+['1','2'].map(c=>'<button class="'+(cls==c?'p':'')+'" style="border:0;margin:0" onclick="setCls(\''+c+'\')">'+(c=='1'?'1ère année':'2ème année')+'</button>').join('')+'</span></div>'}
function setCls(c){cls=c;render()}
const LZ={1:[[2,8,10,'ECSM','T4'],[4,10,12,'ECSM','M3'],[3,14,18,'TP CAO','Atelier MA']],2:[[2,10,12,'ECSM','T4'],[4,8,10,'ECSM','M3']]};
function nextSess(c){let d=new Date();for(let k=0;k<30;k++){const s=iso(d),w=d.getDay();if(!hol(s)){const e=LZ[c].find(x=>x[0]==w&&!(x[3]=='TP CAO'&&(S.cancel||[]).includes(s)));if(e)return{date:s,h1:e[1],h2:e[2],subj:e[3],room:e[4]}}d.setDate(d.getDate()+1)}return null}
function vHM(){const N=nextSess(cls),L=ST[cls],ses=Object.keys(S.sess).filter(k=>k.startsWith(cls+'|')).length,pr=S.prior[cls]||0;
const ds=S.evals.filter(e=>e.cls==cls&&e.type=='Devoir surveillé'),done=ds.filter(e=>Object.keys(e.g).length).length;
const nx=S.evals.filter(e=>e.cls==cls&&e.date>=iso(new Date())).sort((a,b)=>a.date<b.date?-1:1)[0];
const sm=[1,2].map(s=>{const a=ds.filter(e=>e.sem==s&&e.subj=='ECSM'),f=a.filter(e=>Object.keys(e.g).length).length;return '<div class="row" style="margin:12px 0"><div style="flex:1"><div>Semestre '+s+'</div><div class="bar2" style="margin:6px 0"><i style="width:'+Math.min(100,f*50)+'%"></i></div><div class="m">'+a.length+'/2 datés · '+f+'/2 effectués</div></div><button onclick="planDS('+s+')">Planifier ↗</button></div>'}).join('');
return (user?'':'<div class="card warn">☁ Non connecté : les données de cet appareil ne sont pas synchronisées. <button class="p" style="margin-top:6px" onclick="localStorage.removeItem(\'btsNoSync\');loginUI()">Se connecter</button></div>')+seg()+'<div class="hero"><div class="gr">'+gear(84)+'</div><div style="font-size:11px;letter-spacing:2px;color:#dbe7f0;font-weight:700">MAINTENANCE AUTOMOBILE · '+(cls=='1'?'1ÈRE':'2ÈME')+' ANNÉE</div><h2 style="margin:10px 0;max-width:70%">Une classe, un cours. Tout pour la prochaine séance.</h2>'+(N?'<div style="color:#dbe7f0;max-width:75%">'+fd(N.date)+'<br>'+N.h1+'h–'+N.h2+'h · '+esc(N.room)+'<br>'+L.length+' étudiants · '+esc(N.subj)+'</div><p><button style="background:#f5a54a;color:#0f2a3d;border:0;font-weight:700" onclick="sdate=\''+N.date+'\';sub=\''+N.subj+'\';go(\'se\')">+ Préparer une séance</button></p>':'')+'</div>'
+'<div class="grid"><div class="card"><div class="m">SÉANCES EFFECTUÉES</div><div class="big">'+(ses+pr)+'</div><div class="m">dont '+pr+' séances antérieures <button style="padding:2px 8px" onclick="setPrior()">✎</button></div></div><div class="card"><div class="m">DS EFFECTUÉS</div><div class="big">'+done+' <span class="m">/ 4</span></div><div class="m">2 par semestre</div></div><div class="card"><div class="m">PROCHAINE ÉVALUATION</div><div class="big" style="font-size:22px">'+(nx?esc(nx.title):'—')+'</div><div class="m">'+(nx?fd(nx.date):'Aucune planifiée')+'</div></div><div class="card"><div class="m">REMARQUES À REPRENDRE</div><div class="big">'+S.rem[cls].length+'</div><div class="m">Un fil pour la suite</div></div></div>'
+'<div class="card"><h3 style="margin:0">Le fil du cours</h3><div class="m" style="letter-spacing:1px;margin:6px 0">DERNIER POINT D\'ARRÊT</div><textarea id="fil" placeholder="Chapitre, exercice, question…" style="min-height:80px">'+esc(S.fil[cls]||'')+'</textarea><p><button onclick="saveFil()">Enregistrer le point de reprise</button></p></div>'
+'<div class="card"><h3 style="margin:0">Objectif : deux DS par semestre</h3>'+sm+'</div>'
+'<div class="card"><h3 style="margin:0">Remarques à reprendre</h3>'+S.rem[cls].map((t,i)=>'<div class="row" style="margin-top:6px"><span>'+esc(t)+'</span><button onclick="delRem('+i+')">✓</button></div>').join('')+'<div class="row" style="margin-top:8px"><input id="rm" placeholder="Nouvelle remarque" style="flex:1"><button class="p" onclick="addRem()">Ajouter</button></div></div>'}
function saveFil(){S.fil[cls]=document.getElementById('fil').value;save();alert('Point de reprise enregistré')}
function addRem(){const t=document.getElementById('rm').value.trim();if(!t)return;S.rem[cls].push(t);save();render()}
function delRem(i){S.rem[cls].splice(i,1);save();render()}
function setPrior(){const v=prompt('Nombre de séances antérieures (avant l\'application) :',S.prior[cls]||0);if(v===null)return;S.prior[cls]=Math.max(0,parseInt(v)||0);save();render()}
function planDS(s){tab='ev';render();newEv();const e=document.getElementById('esm');if(e)e.value=s}
function vTR(){const L=ST[cls],D=S.draw[cls],rest=L.filter(x=>!D.includes(x[0])),last=D.length?L.find(x=>x[0]==D[D.length-1]):null;
return seg()+'<div class="card" style="text-align:center"><div class="m" style="letter-spacing:2px;font-weight:700">UN PASSAGE POUR CHACUN</div><div style="margin:8px">'+gear(70)+'</div><h2 style="margin:6px 0" dir="auto">'+(last?esc(last[1]+' '+last[2]):'Qui prend le relais ?')+'</h2><p class="m">'+rest.length+' candidat(s) restant(s) sur '+L.length+'.<br>Chaque étudiant tiré est retiré jusqu\'au prochain cycle.</p><button class="p" onclick="doDraw()" '+(rest.length?'':'disabled')+'>⟳ Tirer au sort</button><div class="row" style="margin-top:10px"><button onclick="undoDraw()" '+(D.length?'':'disabled')+'>Annuler le dernier tirage</button><button onclick="newCycle()">Nouveau cycle</button></div></div><div class="card"><b>Déjà passés au tableau</b>'+(D.length?D.map((c,i)=>{const x=L.find(y=>y[0]==c);return x?'<div class="m" style="margin-top:6px">'+(i+1)+'. <span dir="auto">'+esc(x[1]+' '+x[2])+'</span></div>':''}).join(''):'<p class="m">Aucun passage pour le moment.</p>')+'</div>'}
function doDraw(){const L=ST[cls],D=S.draw[cls],rest=L.filter(x=>!D.includes(x[0]));if(!rest.length)return;D.push(rest[Math.floor(Math.random()*rest.length)][0]);save();render()}
function undoDraw(){S.draw[cls].pop();save();render()}
function newCycle(){if(confirm('Commencer un nouveau cycle ? La liste des passages sera vidée.')){S.draw[cls]=[];save();render()}}
const ROT=[2,3,1];
function plan(){const out=[];let d=new Date('2026-10-14T12:00'),n=0;while(iso(d)<='2027-06-30'){const s=iso(d);if(!hol(s)){if((S.cancel||[]).includes(s))out.push({date:s,c:1});else out.push({date:s,g:ROT[n++%3]})}d.setDate(d.getDate()+7)}return out}
function vTP(){const p=plan(),nx=p.find(x=>x.date>=iso(new Date())&&!x.c);return '<p class="m">TP maintenance auto – 1ère année – mercredi 14h–18h (Atelier MA). 3 groupes de 10 : G1 n° 1–10, G2 n° 11–20, G3 n° 21–30. Ordre : G2 → G3 → G1. Les jours fériés, vacances et séances annulées sont sautés.</p>'+p.map(x=>{if(x.c)return '<div class="card row" style="opacity:.6"><div><b style="text-decoration:line-through">'+fd(x.date)+'</b><div class="m">Séance annulée</div></div><button onclick="cancelTP(\''+x.date+'\')">Rétablir</button></div>';const r=S.sess[sk('1','TP CAO',x.date)],na=r?Object.keys(r.a||{}).length:0,ng=r?Object.keys(r.g||{}).length:0,a=(x.g-1)*10+1,b=Math.min(x.g*10,ST[1].length);return '<div class="card row '+(nx&&nx.date==x.date?'nx hl':'')+'" onclick="openS(\'1\',\'TP CAO\',\''+x.date+'\','+x.g+')"><div><b>'+fd(x.date)+'</b><div class="m">Groupe '+x.g+' – n° '+a+' à '+b+'</div></div><div class="m" style="text-align:right">'+(r?na+' abs · '+ng+' notes':'à faire')+'<br><button style="padding:2px 8px;margin-top:4px" onclick="event.stopPropagation();cancelTP(\''+x.date+'\')">Annuler</button></div></div>'}).join('')}
function cancelTP(d){if(S.cancel.includes(d))S.cancel=S.cancel.filter(x=>x!=d);else{if(!confirm('Annuler la séance du '+fd(d)+' ? Les groupes suivants seront décalés.'))return;S.cancel.push(d)}save();render()}
document.addEventListener('click',e=>{if(e.target.classList&&e.target.classList.contains('syncs')&&!user)loginUI()});
render();initSync();setSync(syncState);

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
